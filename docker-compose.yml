version: '3.8'

services:
  # ===================================
  # POSTGRESQL DATABASE
  # ===================================
  postgres:
    image: postgres:15-alpine
    container_name: libraryextra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: libraryextra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - libraryextra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libraryextra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===================================
  # PGADMIN (DATABASE MANAGEMENT)
  # ===================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: libraryextra-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@libraryextra.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - libraryextra-network
    depends_on:
      postgres:
        condition: service_healthy

  # ===================================
  # SPRING BOOT APPLICATION
  # ===================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libraryextra-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Database
      DATABASE_URL: jdbc:postgresql://postgres:5432/libraryextra
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      # Server
      PORT: 8080
      SPRING_PROFILES_ACTIVE: development

      # JWT
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000

      # Admin User
      ADMIN_NAME: Administrador
      ADMIN_EMAIL: admin@extralibrary.com
      ADMIN_PASSWORD: admin123
      ADMIN_CPF: "00000000000"
      ADMIN_PHONE: "11999999999"
      ADMIN_DATE_BIRTH: "1990-01-01"
      ADMIN_ADDRESS: "Endereço Admin"

      # Librarian User
      LIBRARIAN_NAME: Bibliotecário
      LIBRARIAN_EMAIL: librarian@extralibrary.com
      LIBRARIAN_PASSWORD: lib123
      LIBRARIAN_CPF: "11111111111"
      LIBRARIAN_PHONE: "11888888888"
      LIBRARIAN_DATE_BIRTH: "1985-05-15"
      LIBRARIAN_ADDRESS: "Endereço Bibliotecário"

      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080

      # Debug
      SHOW_SQL: "true"
      LOG_LEVEL: DEBUG

    networks:
      - libraryextra-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ===================================
# VOLUMES
# ===================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# ===================================
# NETWORKS
# ===================================
networks:
  libraryextra-network:
    driver: bridge