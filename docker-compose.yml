version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: libraryextra-postgres
    environment:
      POSTGRES_DB: libraryextra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - libraryextra-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: libraryextra-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@libraryextra.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - libraryextra-network

  app:
    build: .
    container_name: libraryextra-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/libraryextra
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - libraryextra-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  libraryextra-network:
    driver: bridge