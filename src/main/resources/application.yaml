spring:
  application:
    name: ExtraLibrary

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/libraryextra}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${PORT:8081}
  # ← ADICIONADO: Configurações para Railway/HTTPS
  forward-headers-strategy: framework
  use-forward-headers: true
  require-ssl: false
  tomcat:
    redirect-context-root: false
    use-relative-redirects: true
  error:
    include-message: always
    include-binding-errors: always

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    disable-swagger-default-url: true
    # ← ADICIONADO: Configurações específicas para Railway
    config-url: /v3/api-docs/swagger-config
    oauth2-redirect-url: /swagger-ui/oauth2-redirect.html

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

# App Configuration
app:
  admin:
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:admin@extralibrary.com}
    password: ${ADMIN_PASSWORD:admin123}
    cpf: ${ADMIN_CPF:00000000000}
    phone: ${ADMIN_PHONE:11999999999}
    dateBirth: ${ADMIN_DATE_BIRTH:1990-01-01}
    address: ${ADMIN_ADDRESS:Endereço Admin}

  librarian:
    name: ${LIBRARIAN_NAME:Bibliotecário}
    email: ${LIBRARIAN_EMAIL:librarian@extralibrary.com}
    password: ${LIBRARIAN_PASSWORD:lib123}
    cpf: ${LIBRARIAN_CPF:11111111111}
    phone: ${LIBRARIAN_PHONE:11888888888}
    dateBirth: ${LIBRARIAN_DATE_BIRTH:1985-05-15}
    address: ${LIBRARIAN_ADDRESS:Endereço Bibliotecário}

# CORS Configuration - ← ATUALIZADO
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,https://extralibrary-production.up.railway.app}

# Logging
logging:
  level:
    com.library: ${LOG_LEVEL:INFO}
    org.springframework.security: ${LOG_LEVEL:INFO}
    br.com.ExtraLibrary.ExtraLibrary: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
# Development Profile
spring:
  config:
    activate:
      on-profile: development
  jpa:
    show-sql: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false

  # ← ADICIONADO: Configurações específicas de produção
  server:
    forward-headers-strategy: framework
    use-forward-headers: true

logging:
  level:
    root: INFO
    br.com.ExtraLibrary.ExtraLibrary: INFO